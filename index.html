<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; padding: .5rem; border: 1px solid #ccc; border-radius: .25rem; font: inherit; }
    #notice:empty { display: none; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="notice" role="status"></p>
  <section id="suggestion" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <p>Черновик ответа:</p>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    import { renderTriage } from "/view.mjs";

    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const view = {
      notice: document.querySelector("#notice"),
      suggestion: document.querySelector("#suggestion"),
      topic: document.querySelector("#topic"),
      draft: document.querySelector("#draft"),
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      renderTriage(view, { status: "pending" });
      button.disabled = true;
      let reply;
      try {
        const response = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        reply = await response.json();
      } catch {
        reply = { status: "unavailable" };
      } finally {
        button.disabled = false;
      }
      renderTriage(view, reply);
    });
  </script>
</body>
</html>
